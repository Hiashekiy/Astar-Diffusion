[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guidance-field"
version = "1.0.0"
description = "Trajectory-to-field guidance for grid search: max-plus obstacle-aware potential fields, colliding-trajectory repair, and distance-aware best-first search."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Astar-Diffusion" }]
keywords = ["path-planning", "potential-field", "best-first-search", "diffusion-guidance"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
guidance-field = "guidance_field.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
