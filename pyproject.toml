[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guidance-field"
version = "1.0.0"
description = "Map + guidance path -> obstacle-aware 2-D potential field -> guided grid search."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["path-planning", "potential-field", "best-first-search", "guidance"]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
fast = ["scipy>=1.7"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
